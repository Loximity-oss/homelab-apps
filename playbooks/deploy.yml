---
# playbooks/deploy.yml - one app play: ONE deployment, its selected hosts. Class C (playbooks/**).
# Proposal: infra docs/proposals/homelab-apps/1-boundary-catalogue.md 1.7 and 5-pipeline-classes.md 5.1.
# Run by `apps-play-run` (CT 300, as runner-apps-play) from src/apps:
#   ansible-playbook -i <run>/inventory.yml --limit <hosts> -e apps_run_app=<app> [--check --diff] playbooks/deploy.yml
# The run dir holds src/apps (this repo at the deployed sha) and src/infra (infra main, for the guest specs).
#
# Variable precedence (never --extra-vars for deployment data, never play vars for it):
#   1. inventory (generated by ci-deploy.sh): host vars from the infra spec (ansible_host, vmid, zone, role, ...),
#      group vars of deployment_<zone>_<app> = deployment `vars`, host vars from `host_vars` written after the infra
#      ones. Banned keys were refused when the inventory was written and again by the PR lint gate.
#   2. Play 1 below computes the version variables from the catalogue (`version.vars`) and sets them with set_fact.
#      Those are the ONLY values the catalogue turns into role variables. They win over role defaults and
#      deployment vars, and a deployment that already sets such a variable is refused (use `version:` instead).
#   3. This file sets only apps_* variables. Deployments and host_vars cannot set apps_* (banned), so nothing a
#      deployment says can override inventory identity or the guard inputs.
#
# Deploy guard (defence in depth; ci-deploy.sh already ran scripts/guard.py with protected.yaml before this starts):
# play 1 runs on the controller only (assert / include_vars / set_fact, no SSH) for ALL hosts before any role runs,
# with any_errors_fatal. Play 2 refuses to start on a host that did not pass it.

- name: Deploy guard and catalogue resolution (no host is contacted)
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  vars:
    apps_root: "{{ playbook_dir | dirname }}"
    apps_infra_root: "{{ playbook_dir | dirname | dirname }}/infra"
    apps_tools_root: "{{ playbook_dir | dirname | dirname }}"
  tasks:
    - name: Pipeline inputs are present and well formed
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.19.0', '>=')
          - apps_run_app is defined
          - apps_deployment is defined
          - apps_deployment_zone is defined
          - apps_deployment_app is defined
          - apps_run_app is match('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')
          - apps_deployment_zone is match('^(dmz|shr|int|stg|wifi|iot)$')
          - apps_deployment_app == apps_run_app
          - apps_deployment == 'deployments/' ~ apps_deployment_zone ~ '/' ~ apps_deployment_app ~ '.yaml'
        fail_msg: "deploy guard: inputs missing or malformed (ansible-core >= 2.19, apps_run_app, apps_deployment*)"

    - name: Load the deployment, the catalogue entry, the environment list and the no-apps list
      ansible.builtin.include_vars:
        file: "{{ item.file }}"
        name: "{{ item.name }}"
      loop:
        - {file: "{{ apps_root }}/{{ apps_deployment }}", name: apps_dep}
        - {file: "{{ apps_root }}/catalog/{{ apps_run_app }}/app.yaml", name: apps_entry}
        - {file: "{{ apps_root }}/environments.yaml", name: apps_envs}
        - {file: "{{ apps_root }}/policy/no-apps.yaml", name: apps_no_apps}
      loop_control:
        label: "{{ item.name }}"

    - name: Deployment, entry and environment agree
      ansible.builtin.assert:
        that:
          - apps_dep.app == apps_run_app
          - (apps_dep.zone | default(apps_deployment_zone)) == apps_deployment_zone
          - apps_entry.name == apps_run_app
          - apps_envs[apps_deployment_zone] is defined
          - apps_entry.catalog.status in apps_envs[apps_deployment_zone].status
          - ansible_play_hosts_all | difference(apps_dep.hosts) | length == 0
          - (apps_no_apps.vmids | default([])) | length > 0
          - apps_entry.rollout.serial | int == 1
          - apps_entry.rollout.order == 'sorted'
          - apps_entry.rollout.stop_on_failure | bool
          - (apps_entry.rollout.groups | default([])) | length == 0
          - apps_entry.health is defined
          - apps_entry.health.timeout_s | int > 0
          - apps_entry.health.timeout_s | int <= 300
        fail_msg: >-
          deploy guard: deployment/entry/environment mismatch, or a rollout feature this playbook does not
          implement yet (serial other than 1, order other than sorted, rollout.groups)

    - name: Load the infra guest spec of this host (it must be in the deployment's zone stack)
      ansible.builtin.include_vars:
        file: "{{ apps_infra_root }}/terraform/stacks/hm1/{{ apps_deployment_zone }}/guests/{{ inventory_hostname }}.yaml"
        name: apps_spec

    - name: Look for a protected.yaml copy supplied by the pipeline (src/standards/protected.yaml)
      ansible.builtin.set_fact:
        apps_protected_file: "{{ query('ansible.builtin.first_found', [apps_tools_root ~ '/standards/protected.yaml'], skip=True) }}"

    - name: Load protected.yaml
      ansible.builtin.include_vars:
        file: "{{ apps_protected_file | first }}"
        name: apps_protected
      when: apps_protected_file | length > 0

    - name: protected.yaml not supplied
      ansible.builtin.debug:
        msg: >-
          deploy guard: no protected.yaml in the run dir; protected VMIDs, templates and subnets are enforced only by
          ci-deploy.sh (scripts/guard.py) and by a host having to exist in the infra specs (protected guests have none)
      when: apps_protected_file | length == 0

    - name: Host identity matches the infra spec and the deployment
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^hm1-(dmz|shr|int|stg|wifi|iot)-[a-z][a-z0-9]*[0-9]{2}$')
          - inventory_hostname.split('-')[1] == apps_deployment_zone
          - (apps_spec.hostname | default(inventory_hostname)) == inventory_hostname
          - inventory_hostname in apps_dep.hosts
          - zone == apps_deployment_zone
          - vmid | int == apps_spec.vmid | int
          - role == apps_spec.role
          - ansible_host == apps_spec.ip | string | split('/') | first
          - ansible_host is not match('^(127[.]|0[.]0[.]0[.]0|localhost|::1)')
          - (ansible_connection | default('ssh')) == 'ssh'
          - ('zone_' ~ apps_deployment_zone) in group_names
          - ('role_' ~ apps_spec.role) in group_names
          - ('deployment_' ~ ((apps_deployment_zone ~ '_' ~ apps_deployment_app) | regex_replace('[^a-z0-9_]', '_'))) in group_names
          - apps_spec.role in ([apps_entry.catalog.role] if apps_entry.catalog.role is string else apps_entry.catalog.role)
          - apps_spec.vmid | int not in (apps_no_apps.vmids | map('int') | list)
        fail_msg: "deploy guard: {{ inventory_hostname }} does not match its infra spec, zone, deployment or the no-apps list"

    - name: Host is not a protected guest or a template (when protected.yaml was supplied)
      ansible.builtin.assert:
        that:
          - (apps_protected.vmids | default({})) | length > 0
          - apps_spec.vmid | int not in (apps_protected.vmids | list | map('int') | list)
          - not ((apps_protected.templates | default([0, -1]))[0] | int <= apps_spec.vmid | int <= (apps_protected.templates | default([0, -1]))[1] | int)
        fail_msg: "deploy guard: {{ inventory_hostname }} (VMID {{ apps_spec.vmid }}) is protected or in the template range"
      when: apps_protected_file | length > 0

    - name: Resolve the version (deployment pin or the catalogue pin)
      ansible.builtin.set_fact:
        apps_pin: >-
          {{ (apps_entry.version.pin if (apps_dep.version | default('catalog', true)) == 'catalog'
          else apps_dep.version) | string }}

    - name: The pin is known, and a deployment pin carries pin_until
      ansible.builtin.assert:
        that:
          - apps_pin in (apps_entry.version.known | default({}) | list | map('string') | list)
          - (apps_dep.version | default('catalog', true)) == 'catalog' or apps_dep.pin_until | default(none) is not none
          - (apps_entry.version.vars | default({})) | length > 0
        fail_msg: "deploy guard: version {{ apps_pin }} is not in version.known (or a pin has no pin_until, or version.vars is empty)"

    - name: Role variables named by version.vars are well formed and not set by the deployment
      ansible.builtin.assert:
        that:
          - item.key in ['version', 'url', 'sha256']
          - item.value is string
          - item.value is match('^(app|svc)_' ~ (apps_run_app | replace('-', '_')) ~ '_[a-z0-9_]+$')
          - vars[item.value] is not defined
        fail_msg: >-
          deploy guard: version.vars.{{ item.key }} must name a role variable (app_|svc_)<app>_<name> that the
          deployment does not set itself
      loop: "{{ (apps_entry.version.vars | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Set the version variables of the role
      ansible.builtin.set_fact:
        "{{ item.value }}": "{{ {'version': apps_pin, 'url': apps_url, 'sha256': apps_sha}[item.key] }}"
      vars:
        apps_url: "{{ apps_entry.version.url | default('') | replace('{version}', apps_pin) }}"
        apps_sha: "{{ apps_entry.version.known[apps_pin] | default('') }}"
      loop: "{{ (apps_entry.version.vars | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Guard passed
      ansible.builtin.set_fact:
        apps_guard_ok: true

- name: Deploy the catalogue entry, one host at a time
  hosts: all
  remote_user: root
  gather_facts: true
  serial: 1
  order: sorted
  any_errors_fatal: true
  vars:
    apps_root: "{{ playbook_dir | dirname }}"
  pre_tasks:
    - name: Refuse a host that did not pass the guard
      ansible.builtin.assert:
        that:
          - apps_guard_ok | default(false) | bool
          - apps_run_app == apps_deployment_app
        fail_msg: "deploy guard: {{ inventory_hostname }} did not pass the guard play"

  tasks:
    - name: Role of the catalogue entry
      ansible.builtin.include_role:
        name: "{{ apps_root }}/catalog/{{ apps_run_app }}/role"

    - name: Run the role's handlers before the healthcheck
      ansible.builtin.meta: flush_handlers

    - name: Health - services are active
      ansible.builtin.command:
        argv: ["systemctl", "is-active", "--quiet", "{{ item }}"]
      register: apps_health_svc
      until: apps_health_svc.rc == 0
      retries: 6
      delay: 5
      changed_when: false
      loop: "{{ apps_entry.health.services | default([]) }}"
      when: not ansible_check_mode

    - name: Health - command (exit 0 = healthy, hard timeout)
      ansible.builtin.command:
        argv: ["timeout", "{{ apps_entry.health.timeout_s | int }}", "bash", "-c", "{{ apps_entry.health.command }}"]
      register: apps_health_cmd
      until: apps_health_cmd.rc == 0
      retries: 6
      delay: 5
      changed_when: false
      when:
        - not ansible_check_mode
        - apps_entry.health.command is defined

    - name: Health skipped in check mode
      ansible.builtin.debug:
        msg: "check mode: nothing was changed, so the healthcheck of {{ inventory_hostname }} is not run"
      when: ansible_check_mode
