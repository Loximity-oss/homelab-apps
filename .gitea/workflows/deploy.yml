name: deploy
# Deploys catalogue entries to the hosts in deployments/, from main only (scripts/ci-deploy.sh refuses any other ref
# and checks out main's sha). Since cutover (migration step 10(b), infra #127) this runs in APPLY mode: pre-deploy_
# snapshots, child token per app, waves with WAVE_DELAY, L4 after each wave. APPS_MODE is set here, literally, never
# from an input; going back to check mode (revert order step 1) is its own Class C PR.
# Dispatch inputs (infra apply, Faris) are untrusted: passed only as env, intersected with deployments and specs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosts:
        description: "csv of hostnames (empty = every host of the changed deployments)"
        required: false
        default: ""
      apps:
        description: "csv of catalogue entry names (empty = all changed)"
        required: false
        default: ""
      infra_pr:
        description: "infra PR number that dispatched this run (report is commented there)"
        required: false
        default: ""
jobs:
  deploy:
    if: gitea.ref == 'refs/heads/main'
    runs-on: host-apps
    timeout-minutes: 360 # = APPS_RUN_MAX (6 h): lock wait + the longest wave set, checked up front by ci-deploy.sh
    steps:
      - name: deploy (apply mode)
        env:
          APPS_MODE: apply
          GIT_TOKEN: ${{ gitea.token }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          GITHUB_REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
          EVENT: ${{ gitea.event_name }}
          BEFORE: ${{ gitea.event.before }}
          HOSTS: ${{ inputs.hosts }}
          APPS: ${{ inputs.apps }}
          INFRA_PR: ${{ inputs.infra_pr }}
        run: |
          rm -rf base
          git clone -q --branch main "${SERVER%%://*}://ci:${GIT_TOKEN}@${SERVER#*://}/${REPO}.git" base
          git -C base checkout -q "$SHA"
          bash base/scripts/ci-deploy.sh
